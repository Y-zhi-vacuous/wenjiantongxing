services:
  - type: web
    name: wenjiantongxing
    env: python
    region: singapore
    buildCommand: |
      cd backend && pip install -r requirements.txt
      cd ../frontend && npm install && npm run build
    startCommand: cd backend && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wenjiantongxing-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: zhipu
      - key: AI_MODEL
        value: glm-4-flash
      - key: AI_API_KEY
        value: 08291980aa0d44928db4cf142733edc4.Q41wSJGtwIy2IYmc
      - key: FRONTEND_DIR
        value: ../frontend/dist

databases:
  - name: wenjiantongxing-db
    plan: free
